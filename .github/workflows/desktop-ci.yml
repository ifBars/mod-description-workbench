name: Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run mcp:build
      - run: bun run mcp:smoke

  windows-desktop:
    name: Windows desktop validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run mcp:package
      - run: bun run mcp:smoke
      - name: Smoke standalone MCP
        shell: pwsh
        run: bun run mcp:smoke -- --standalone ".artifacts/release/staging/nexus-description-mcp.exe"
      - name: Smoke portable MCP
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Expand-Archive -LiteralPath ".artifacts/release/Nexus.Description.MCP_${version}_portable.zip" -DestinationPath ".artifacts/portable-smoke"
          bun run mcp:smoke -- --portable ".artifacts/portable-smoke/nexus-description-mcp/server.js"
      - name: Smoke MCP installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & ./scripts/install-mcp.ps1 -Version $version -AssetPath ".artifacts/release/Nexus.Description.MCP_${version}_windows-x64.zip" -ChecksumPath ".artifacts/release/SHA256SUMS.txt" -InstallRoot ".artifacts/install-smoke" -SkipCodexRegistration
          bun run mcp:smoke -- --standalone ".artifacts/install-smoke/${version}/nexus-description-mcp.exe"
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-features
      - run: bun run desktop:check -- --all-features
