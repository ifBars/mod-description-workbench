name: Release desktop app

on:
  push:
    tags: [v*]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run version:check
      - run: bun run release:tag-check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run desktop:release
      - run: bun run updater:manifest
      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Desktop app
          - Initial Windows desktop release with native file dialogs, lifecycle persistence, and restrained window chrome.

          ## Web compatibility
          - The GitHub Pages app remains browser-first and local-first; desktop update code does not run there.

          ## Security and privacy
          - Updates use Tauri signatures and HTTPS release metadata. No account, telemetry, remote draft storage, or Nexus automation is included.

          ## Installation and updates
          - Install either the NSIS setup executable or MSI. Future desktop updates require a newer signed release and your explicit confirmation. Windows publisher signing is not configured for this release.
          '@ | Set-Content -LiteralPath .artifacts/release-notes.md -Encoding utf8
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msi = "src-tauri/target/release/bundle/msi/Mod Description Workbench_${version}_x64_en-US.msi"
          $nsis = "src-tauri/target/release/bundle/nsis/Mod Description Workbench_${version}_x64-setup.exe"
          @($msi, "${msi}.sig", $nsis, "${nsis}.sig", '.artifacts/latest.json') | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_) -or (Get-Item -LiteralPath $_).Length -eq 0) {
              throw "Required release artifact is missing or empty: $_"
            }
          }
          gh release create $env:RELEASE_TAG $msi "${msi}.sig" $nsis "${nsis}.sig" .artifacts/latest.json --repo $env:GITHUB_REPOSITORY --title "Mod Description Workbench $env:RELEASE_TAG" --notes-file .artifacts/release-notes.md --verify-tag --latest
