[package]
name = "mod-description-workbench"
version = "0.2.1"
description = "A local-first editor and Nexus Mods previewer for mod descriptions."
authors = ["ifBars"]
edition = "2021"

[lib]
name = "mod_description_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
updater = ["dep:tauri-plugin-process", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-updater = { version = "2.10.1", optional = true }
